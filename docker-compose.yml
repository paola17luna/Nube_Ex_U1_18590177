services:
  flask:
    image: ${FLASK_IMAGE}
    ports:
      - target: 5000
        published: 5004
        protocol: tcp
        mode: host
    environment:
      DATABASE_URL: ${DATABASE_URL}
    networks:
      - red_bd
    deploy:
      replicas: 1
      placement:
        constraints:
          - node.role == manager
      restart_policy:
        condition: on-failure

  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - red_bd
    deploy:
      replicas: 1
      placement:
        constraints:
          - node.labels.paola_db == true
      restart_policy:
        condition: on-failure

networks:
  red_bd:
    external: true
    name: paola_red_bd

volumes:
  postgres_data: